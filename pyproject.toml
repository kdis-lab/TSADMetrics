[project]
name = "tsadmetrics"
version = "1.0.11"
description = "Librería para evaluación de detección de anomalías en series temporales"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "Pedro Rafael Velasco Priego", email = "i12veprp@uco.es" },
  { name = "Amelia Zafra Gómez", email = "azafra@uco.es" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.4,<2.0",
    "pandas>=2.0.3,<3.0",
    "PyYAML>=6.0.2,<7.0"
]
[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "iniconfig==2.1.0",
    "pluggy==1.5.0",
    "tomli==2.2.1",
    "exceptiongroup==1.3.0",
    "ipython>=7.0",
    "sphinx",
    "sphinx-rtd-theme",
    "numpydoc",
    "myst-parser"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tsadmetrics*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
tsadmetrics = ["py.typed", "config/*.yaml"]

[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[dynamic]
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: GNU General Public License v3 or later (GPLv3+)",
        "Operating System :: OS Independent",
        "Intended Audience :: Science/Research",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
    ]
