[project]
name = "tsadmetrics"
version = "1.0.16"
description = "Python library for evaluating time-series anomaly detection methods"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
  { name = "Pedro Rafael Velasco Priego", email = "i12veprp@uco.es" },
  { name = "Amelia Zafra Gómez", email = "azafra@uco.es" }
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
    "PyYAML"
]
[project.urls]
Homepage = "https://tsadmetrics.readthedocs.io/"
"Source Code" = "https://github.com/kdis-lab/TSADMetrics"
Documentation = "https://tsadmetrics.readthedocs.io/"
"Issue Tracker" = "https://github.com/kdis-lab/TSADMetrics/issues"
Paper = "https://doi.org/10.1016/j.neucom.2026.134154"

[project.optional-dependencies]
dev = [
    "pytest",
    "scikit-learn",
    "ipython",
]
docs = [
    "sphinx>=7.1.2",
    "numpydoc",
    "furo",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["tsadmetrics*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
tsadmetrics = ["py.typed", "config/*.yaml"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dynamic]
classifiers=[
        "Programming Language :: Python :: 3",
        "License :: GNU General Public License v3 or later (GPLv3+)",
        "Operating System :: OS Independent",
        "Intended Audience :: Science/Research",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
    ]
